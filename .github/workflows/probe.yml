name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Drammen
        run: |
          set +e
          B=https://drivstoffpriser.github.io/Drivstoffpriser-App/data
          curl -sS -m 60 -o stations.json $B/stations.json
          curl -sS -m 60 -o prices.json $B/prices.json
          curl -sS -m 40 -L -o chains.html https://drivstoffappen.no/drivstoffpriser
          curl -sS -m 40 -L -o drammen.html https://www.drivstoffapp.no/search/drammen
          python3 - <<'PY'
          import json, re, math
          LAT, LNG = 59.7411855, 10.2200486
          def dist(a,b,c,d):
              R=6371000; p1,p2=math.radians(a),math.radians(c); dp=p2-p1; dl=math.radians(d-b)
              h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
              return 2*R*math.asin(math.sqrt(h))
          st = json.load(open("stations.json"))["stations"]
          near = sorted([(dist(LAT,LNG,s["latitude"],s["longitude"]), s) for s in st], key=lambda x:x[0])[:15]
          pr = json.load(open("prices.json"))["prices"]
          byid = {}
          for p in pr: byid.setdefault(p["stationId"], []).append(p)
          for d,s in near:
              print("NEAR %5.0f m | %-30s | %-12s | %s | %s | community=%s" % (d, s["name"], s["brand"], s["address"], s["id"], [(p["fuelType"],p["price"],p["updatedAt"][:10]) for p in byid.get(s["id"],[])]))
          h = open("chains.html", encoding="utf-8", errors="replace").read()
          t = re.search(r"Kjedene i dag.*?</table>", h, re.S)
          rows = re.findall(r"<tr[^>]*>(.*?)</tr>", t.group(0) if t else "", re.S)
          for r in rows:
              cells = [re.sub("<[^>]+>","",c).strip() for c in re.findall(r"<t[hd][^>]*>(.*?)</t[hd]>", r, re.S)]
              print("CHAIN", cells)
          d = open("drammen.html", encoding="utf-8", errors="replace").read()
          for b in re.findall(r'<script[^>]*application/ld\+json[^>]*>(.*?)</script>', d, re.S):
              try: j = json.loads(b)
              except Exception: continue
              for it in j.get("itemListElement", []):
                  s = it.get("item", {})
                  if s.get("@type") != "GasStation": continue
                  g = s.get("geo", {})
                  offers = [(o.get("name"), o.get("price"), o.get("priceValidUntil")) for o in s.get("hasOfferCatalog",{}).get("itemListElement",[])]
                  dd = dist(LAT,LNG,g.get("latitude",0),g.get("longitude",0))
                  if dd < 6000: print("WEB %5.0f m | %-28s | %s | %s" % (dd, s.get("name"), (s.get("brand") or {}).get("name"), offers))
          PY
