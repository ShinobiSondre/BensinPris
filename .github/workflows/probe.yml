name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          for u in https://api.circlek.com/eu/prices "https://api.circlek.com/eu/prices?country=NO" https://api.circlek.com/no/prices; do
            code=$(curl -sS -m 40 -o ck.json -w '%{http_code}' -H 'Accept: application/json' "$u"); echo "CK $u -> $code, $(wc -c < ck.json) bytes"
            head -c 700 ck.json; echo
          done
          curl -sS -m 40 -o ck.json https://api.circlek.com/eu/prices
          python3 - <<'PY'
          import json, collections
          try:
              d = json.load(open("ck.json"))
          except Exception as e:
              print("CKPARSE fail", e); raise SystemExit
          def walk(x, depth=0, path="$"):
              if depth > 3: return
              if isinstance(x, dict):
                  print("CKSHAPE", path, "dict keys", list(x.keys())[:20])
                  for k, v in list(x.items())[:3]: walk(v, depth+1, path+"."+str(k))
              elif isinstance(x, list):
                  print("CKSHAPE", path, "list len", len(x))
                  if x: walk(x[0], depth+1, path+"[0]")
          walk(d)
          s = json.dumps(d)
          for word in ["Norway", "Norge", "NO", "NOR", "Oslo", "Drammen", "Bergen", "NOK"]:
              print("CKCOUNT", word, s.count('"'+word+'"'), s.count(word))
          PY
