name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set +e
          curl -sS -m 30 https://drivstoffappen.no/robots.txt | head -30 | sed 's/^/ROBOTS /'
          code=$(curl -sS -m 40 -L -o page.html -w '%{http_code}' https://drivstoffappen.no/drivstoffpriser); echo "PAGE code $code bytes $(wc -c < page.html)"
          python3 - <<'PY'
          import re
          h = open("page.html", encoding="utf-8", errors="replace").read()
          for kw in ["Kjede", "Uno-X", "Billigste kjede", "__NEXT_DATA__", "application/ld+json", "<table", "self.__next_f"]:
              print("COUNT", kw, h.count(kw))
          i = h.find("<table")
          if i >= 0:
              print("TABLE", h[i:i+4000].replace("\n", " "))
          for m in re.finditer(r'Uno-X', h):
              print("CTX", h[max(0, m.start()-300):m.start()+300].replace("\n", " "))
              break
          j = h.find("__NEXT_DATA__")
          if j >= 0: print("NEXT", h[j:j+3000])
          PY
