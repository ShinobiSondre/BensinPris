name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe drivstoffprisene.no
        run: |
          set +e
          U=https://drivstoffprisene.no
          curl -sS -m 30 -o main.js $U/js/main.js
          grep -oE "import[^;]{0,120}from ['\"][^'\"]+['\"]" main.js | sed 's/^/IMPORT /' | head -20
          grep -oE "fetch\([^)]{0,160}\)" main.js | sed 's/^/FETCH /' | head -30
          grep -oE "['\"\`]/(api|data)[^'\"\`]{0,80}['\"\`]" main.js | sort -u | sed 's/^/PATH /' | head -30
          for m in $(grep -oE "from ['\"][^'\"]+['\"]" main.js | sed "s/from ['\"]//;s/['\"]$//" | head -15); do
            case "$m" in /*) url="$U$m";; ./*) url="$U/js/${m#./}";; *) url="$U/js/$m";; esac
            curl -sS -m 30 -o mod.js "$url"; echo "MODULE $url $(wc -c < mod.js)"
            grep -oE "fetch\([^)]{0,160}\)" mod.js | sed 's/^/MFETCH /' | head -15
            grep -oE "['\"\`]/(api|data)[^'\"\`]{0,80}['\"\`]" mod.js | sort -u | sed 's/^/MPATH /' | head -15
          done
          curl -sS -m 30 -L $U/om -o om.html
          python3 - <<'PY'
          import re, html
          t = open("om.html", encoding="utf-8", errors="replace").read()
          t = re.sub(r"<script.*?</script>|<style.*?</style>", " ", t, flags=re.S)
          t = html.unescape(re.sub(r"<[^>]+>", " ", t)); t = re.sub(r"\s+", " ", t)
          print("OM", t[:3500])
          PY
