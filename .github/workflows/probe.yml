name: Probe data sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe drivstoffprisene.no API
        run: |
          set +e
          U=https://drivstoffprisene.no
          curl -sS -m 30 -o api.js $U/js/api.js
          python3 - <<'PY'
          s = open("api.js").read()
          i = s.find("hentStasjoner")
          print("APIJS", s[max(0,i-300):i+1800].replace("\n"," "))
          PY
          curl -sS -m 30 -o t.js $U/js/turnstile-verifisering.js
          python3 -c "s=open('t.js').read(); print('TURN', s[:1500].replace(chr(10),' '))"
          code=$(curl -sS -m 30 -A "BensinPris/1.0 (github.com/ShinobiSondre/BensinPris)" -H "Accept: application/json" -o st.json -w '%{http_code}' "$U/api/stasjoner?lat=59.7412&lon=10.2200&radius=5")
          echo "STATUS $code $(wc -c < st.json)"
          head -c 2500 st.json | sed 's/^/BODY /'; echo
          python3 - <<'PY'
          import json
          try:
              d = json.load(open("st.json"))
          except Exception as e:
              print("PARSE fail", e); raise SystemExit
          arr = d if isinstance(d, list) else next((v for v in d.values() if isinstance(v, list)), [])
          print("COUNT", len(arr), "TOPKEYS", list(d.keys()) if isinstance(d, dict) else "list")
          for x in arr[:4]: print("ITEM", json.dumps(x, ensure_ascii=False)[:900])
          PY
